<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Dissolve Effect</title>
    <link rel="stylesheet" href="./style.css?v=20260814-mesh-material-1" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="controls" class="control-panel" aria-label="Visualizer controls"></div>

    <div class="load-progress-stack" aria-live="polite" aria-atomic="true">
      <div id="background-load-progress" class="load-progress" hidden>
        <div class="load-progress__meta">
          <span id="background-load-label">Background</span>
          <span id="background-load-percent">0%</span>
        </div>
        <div class="load-progress__track" aria-hidden="true">
          <div id="background-load-fill" class="load-progress__fill"></div>
        </div>
      </div>
      <div id="audio-load-progress" class="load-progress" hidden>
        <div class="load-progress__meta">
          <span id="audio-load-label">Audio</span>
          <span id="audio-load-percent">0%</span>
        </div>
        <div class="load-progress__track" aria-hidden="true">
          <div id="audio-load-fill" class="load-progress__fill"></div>
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js?v=20260815-visual-quality-1"></script>
  </body>
</html>
