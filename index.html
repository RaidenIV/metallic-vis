<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="A metallic audio-reactive sphere visualizer built with Three.js." />
  <title>Metal Sphere Visualizer</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="visualizer" aria-label="Audio reactive metal sphere visualization"></canvas>

    <header class="topbar">
      <div>
        <div class="eyebrow">AUDIO REACTIVE / THREE.JS</div>
        <h1>METAL SPHERE</h1>
      </div>
      <button id="togglePanel" class="icon-button" type="button" aria-label="Toggle controls" aria-expanded="true">☰</button>
    </header>

    <aside id="controlPanel" class="control-panel" aria-label="Visualizer controls">
      <section class="panel-section">
        <div class="section-heading">Audio</div>
        <button id="loadAudioButton" class="primary-button" type="button">LOAD AUDIO</button>
        <input id="audioFileInput" type="file" accept="audio/*" hidden />
        <div id="dropZone" class="drop-zone" tabindex="0">Drop an audio file here</div>
        <label>Sensitivity <output id="sensitivityValue">1.35</output><input id="sensitivity" type="range" min="0.25" max="3" step="0.01" value="1.35" /></label>
        <label>Smoothing <output id="smoothingValue">0.82</output><input id="smoothing" type="range" min="0" max="0.98" step="0.01" value="0.82" /></label>
        <label>Bass <output id="bassValue">1.35</output><input id="bass" type="range" min="0" max="3" step="0.01" value="1.35" /></label>
        <label>Mids <output id="midsValue">0.90</output><input id="mids" type="range" min="0" max="3" step="0.01" value="0.90" /></label>
        <label>Treble <output id="trebleValue">0.55</output><input id="treble" type="range" min="0" max="3" step="0.01" value="0.55" /></label>
      </section>

      <section class="panel-section">
        <div class="section-heading">Sphere</div>
        <label>Radius <output id="radiusValue">2.35</output><input id="radius" type="range" min="1.2" max="4" step="0.01" value="2.35" /></label>
        <label>Deformation <output id="deformationValue">0.78</output><input id="deformation" type="range" min="0" max="2" step="0.01" value="0.78" /></label>
        <label>Noise Scale <output id="noiseScaleValue">2.60</output><input id="noiseScale" type="range" min="0.25" max="8" step="0.01" value="2.60" /></label>
        <label>Noise Speed <output id="noiseSpeedValue">0.22</output><input id="noiseSpeed" type="range" min="0" max="2" step="0.01" value="0.22" /></label>
        <label>Surface Detail <output id="surfaceDetailValue">0.18</output><input id="surfaceDetail" type="range" min="0" max="0.8" step="0.01" value="0.18" /></label>
      </section>

      <section class="panel-section">
        <div class="section-heading">Metal</div>
        <label>Type
          <select id="metalType">
            <option value="platinum" selected>Platinum</option>
            <option value="gold">Gold</option>
            <option value="titanium">Titanium</option>
          </select>
        </label>
        <label>Metalness <output id="metalnessValue">1.00</output><input id="metalness" type="range" min="0" max="1" step="0.01" value="1" /></label>
        <label>Roughness <output id="roughnessValue">0.18</output><input id="roughness" type="range" min="0.02" max="1" step="0.01" value="0.18" /></label>
        <label>Reflection <output id="reflectionValue">1.80</output><input id="reflection" type="range" min="0" max="4" step="0.01" value="1.80" /></label>
      </section>

      <section class="panel-section">
        <div class="section-heading">Propagation</div>
        <label>Mode
          <select id="propagationMode">
            <option value="0">Instant</option>
            <option value="1" selected>Top → Bottom</option>
            <option value="2">Equator → Poles</option>
            <option value="3">Radial Shockwave</option>
            <option value="4">Rotating</option>
            <option value="5">Spiral</option>
          </select>
        </label>
        <label>Speed <output id="propagationSpeedValue">0.55</output><input id="propagationSpeed" type="range" min="0" max="3" step="0.01" value="0.55" /></label>
        <label>Width <output id="propagationWidthValue">0.22</output><input id="propagationWidth" type="range" min="0.03" max="0.8" step="0.01" value="0.22" /></label>
      </section>

      <section class="panel-section">
        <div class="section-heading">Post FX</div>
        <label class="toggle-row"><span>Bloom</span><input id="bloomEnabled" type="checkbox" checked /></label>
        <label>Strength <output id="bloomStrengthValue">0.48</output><input id="bloomStrength" type="range" min="0" max="2.5" step="0.01" value="0.48" /></label>
        <label>Radius <output id="bloomRadiusValue">0.35</output><input id="bloomRadius" type="range" min="0" max="1" step="0.01" value="0.35" /></label>
        <label>Threshold <output id="bloomThresholdValue">0.60</output><input id="bloomThreshold" type="range" min="0" max="1" step="0.01" value="0.60" /></label>
        <label>Exposure <output id="exposureValue">1.10</output><input id="exposure" type="range" min="0.3" max="2.5" step="0.01" value="1.10" /></label>
      </section>

      <section class="panel-section">
        <div class="section-heading">Camera</div>
        <label>Distance <output id="cameraDistanceValue">7.50</output><input id="cameraDistance" type="range" min="3.5" max="14" step="0.01" value="7.50" /></label>
        <label>FOV <output id="fovValue">46</output><input id="fov" type="range" min="25" max="90" step="1" value="46" /></label>
        <label class="toggle-row"><span>Auto Rotate</span><input id="autoRotate" type="checkbox" checked /></label>
        <label>Rotate Speed <output id="rotateSpeedValue">0.35</output><input id="rotateSpeed" type="range" min="-2" max="2" step="0.01" value="0.35" /></label>
        <button id="centerCamera" type="button">CENTER VISUALIZATION</button>
      </section>

      <section class="panel-section">
        <div class="section-heading">Preset</div>
        <div class="button-row">
          <button id="resetPreset" type="button">RESET</button>
          <button id="exportPreset" type="button">EXPORT</button>
        </div>
        <button id="importPreset" type="button">IMPORT JSON</button>
        <input id="presetFileInput" type="file" accept="application/json,.json" hidden />
      </section>
    </aside>

    <div class="player">
      <button id="playPause" class="transport" type="button" aria-label="Play or pause" disabled>▶</button>
      <div class="track-meta">
        <div id="trackName" class="track-name">NO AUDIO LOADED</div>
        <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" disabled aria-label="Seek" />
      </div>
      <label class="volume-label">VOL<input id="volume" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volume" /></label>
    </div>

    <div id="audioStatus" class="status-pill">READY</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
